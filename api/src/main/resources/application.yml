micronaut:
  application:
    name: api
  server:
    cors:
      enabled: true
  security:
    authentication: ${AUTH_MODE:bearer}
    oauth2:
      enabled: ${OAUTH_ENABLED:false}
      clients:
        google:
          client-id: ${OAUTH_CLIENT_ID:xxx}
          client-secret: ${OAUTH_CLIENT_SECRET:yyy}
          openid:
            issuer: 'https://accounts.google.com'
      login-uri: "/api/oauth/login{/provider}"
      callback-uri: "/api/oauth/callback{/provider}"
    endpoints:
      login:
        enabled: true
        path: "/api/login"
      logout:
        get-allowed: true
        path: "/api/logout"
    redirect:
      login-failure: "/sign-up"
      login-success: "/sign-in-succeeded"
      logout: "/logout-succeeded"
    token:
      jwt:
        claims-validators:
          expiration: false
        signatures:
          secret:
            generator:
              secret: ${JWT_SECRET:pleaseChangeThisSecretForAProductionEnvironmentThatIsAtLeast256bits}
              jws-algorithm: HS256
netty:
  default:
    allocator:
      max-order: 3
db:
  name: "cinside"
  personCollection: "person"
  projectCollection: "project"
  projectAnalyticsCollection: "projectAnalytics"
mongodb:
  uri: mongodb://${MONGO_USER:root}:${MONGO_PASSWORD:example}@${MONGO_HOST:mongo}:${MONGO_PORT:27017}
rabbitmq:
  host: rabbitmq
